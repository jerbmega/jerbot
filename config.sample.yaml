# Replace YOUR_TOKEN_HERE with the token of your Discord bot.
# You can add other tokens under different names, and use them with the --token argument.
tokens: 
  default: YOUR_TOKEN_HERE

# Replace YOUR_PREFIX_HERE with your desired prefix for the bot's commands.
# Once Fluxer supports slash commands, this will be deprecated. Beware!
prefix: YOUR_PREFIX_HERE

# Jerbot can load plugins from multiple different folders.
# By default, this is just the plugins folder, but more can be added as needed.
plugin_folders:
  - plugins
  - example_submodule

# This will be dynamically generated once Fluxer.py supports getting the owner of the bot easily.
# For now, hardcode an ID of a user that can run administrative commands (like loading cogs).
owner: YOUR_SNOWFLAKE_HERE